{% extends 'base.html' %}{% load static %}{% block pageContent %}
<style>
    body{
        background-image:url('{% static "assets/default/img/wallpaper.jpg" %}');
        background-repeat:no-repeat;
        background-size:cover;
    }
    main {
        height: 100%;
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: auto;
    }
</style>
<div class="d-flex flex-column w-100 justify-content-center align-items-center">
    <div class="col-lg-4 col-md-6 col-sm-12 col-xs-12">
        <div class="card card-default rounded-0 shadow">
            <div class="card-header">
                <h4 class="card-title"><b>Reset Password</b></h4>
            </div>
            <div class="card-body">
                <div class="container-fluid">
                    <form id="reset-password-form" action="{% url 'reset-password' %}" method="POST">
                        {% csrf_token %}
                        <input type="hidden" name="user_id" value="{{ user.id }}">
                        
                        <div class="mdc-layout-grid">
                            <div class="mdc-layout-grid__inner">
                                <p class="mb-3">Please enter your new password:</p>
                                
                                <div class="form-group mb-3">
                                    <label for="new_password" class="control-label">New Password</label>
                                    <input type="password" class="form-control rounded-0" name="new_password" id="new_password" required="required">
                                </div>
                                
                                <div class="form-group mb-3">
                                    <label for="confirm_password" class="control-label">Confirm Password</label>
                                    <input type="password" class="form-control rounded-0" name="confirm_password" id="confirm_password" required="required">
                                </div>
                                
                                <div class="form-group mb-3">
                                    <div class="d-flex w-100 justify-content-end align-items-center">
                                        <button type="submit" class="btn btn-sm rounded-0 btn-primary">
                                            Reset Password
                                        </button>
                                    </div>
                                </div>
                                
                                {% if messages %}
                                <div class="form-group mb-3">
                                    {% for message in messages %}
                                    <div class="alert {% if message.tags == 'error' %}alert-danger{% elif message.tags == 'success' %}alert-success{% else %}alert-info{% endif %} mb-0">
                                        {{ message }}
                                    </div>
                                    {% endfor %}
                                </div>
                                {% endif %}
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock pageContent %}

{% block ScriptBlock %}
<script>
    $(function() {
        $('#reset-password-form').submit(function(e) {
            e.preventDefault();
            var _this = $(this);
            var newPassword = $('#new_password').val();
            var confirmPassword = $('#confirm_password').val();
            
            if(newPassword !== confirmPassword) {
                alert("Passwords do not match!");
                return false;
            }
            
            if(newPassword.length < 6) {
                alert("Password must be at least 6 characters long!");
                return false;
            }
            
            $.ajax({
                url: _this.attr('action'),
                data: _this.serialize(),
                method: 'POST',
                dataType: 'json',
                error: err => {
                    console.log(err);
                    alert("An error occurred.");
                },
                success: function(resp) {
                    if(resp.status === 'success') {
                        alert("Password reset successfully! You can now login with your new password.");
                        location.href = "{% url 'login-page' %}";
                    } else {
                        alert("Failed to reset password. " + resp.msg);
                    }
                }
            });
        });
    });
</script>
{% endblock ScriptBlock %}
