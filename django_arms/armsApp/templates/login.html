{% extends 'base.html' %}{% load static %}{% block pageContent %}
<style>
    body {
        background:
            radial-gradient(circle at top, rgba(124, 199, 255, 0.18), transparent 25%),
            linear-gradient(135deg, #070b14 0%, #0d1524 50%, #111827 100%);
    }

    main {
        height: 100%;
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: auto;
    }

    #logo-img {
        height: 11em;
        width: 26em;
    }

    .login-shell {
        width: min(100%, 430px);
    }

    .login-card {
        background: linear-gradient(180deg, rgba(15, 21, 32, 0.96), rgba(10, 16, 24, 0.96));
        border: 1px solid rgba(143, 176, 255, 0.2);
        border-radius: 22px;
        box-shadow: 0 18px 45px rgba(0,0,0,0.5);
    }

    .login-card .card-header {
        background: rgba(13, 18, 28, 0.95) !important;
        border-bottom: 1px solid rgba(143, 176, 255, 0.14);
    }

    .login-card .card-title {
        color: #edf6ff;
        letter-spacing: 0.04em;
    }
</style>
<div class="d-flex flex-column w-100 justify-content-center align-items-center py-5">
    <div class="login-shell">
        <div class="card login-card shadow">
            <div class="card-header text-center py-4">
                <h4 class="card-title mb-0"><b>Login</b></h4>
            </div>
            <div class="card-body p-4">
                <div class="container-fluid">
                    <form id="login-user" action="" method="POST">
                        {% csrf_token %}
                        <div class="mdc-layout-grid">
                            <div class="mdc-layout-grid__inner">
                                <div class="form-group mb-3">
                                    <label for="username" class="control-label">User ID</label>
                                    <input type="text" class="form-control" autofocus name="username" id="username" required="required" placeholder="Enter your User ID or Username">
                                </div>
                                <div class="form-group mb-3">
                                    <label for="password" class="control-label">Password</label>
                                    <input type="password" class="form-control" name="password" id="password" required="required" placeholder="Enter your password">
                                </div>
                                <div class="form-group mb-3">
                                    <div class="d-flex w-100 justify-content-between align-items-center">
                                        <div>
                                            <a href="{% url 'public-page' %}">Go Back</a>
                                        </div>
                                        <button class="btn btn-primary px-4">
                                            Login
                                        </button>
                                    </div>
                                </div>
                                <div class="form-group mb-0">
                                    <div class="d-flex w-100 justify-content-between align-items-center">
                                        <div>
                                            <a href="{% url 'register-page' %}">Create an account</a>
                                        </div>
                                        <div>
                                            <a href="{% url 'forgot-password' %}">Forgot Password?</a>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock pageContent %} 
{% block ScriptBlock %}
<script>
    $(function() {
        $('#login-user').submit(function(e) {
            e.preventDefault();
            var _this = $(this)
            $('.err-msg').remove();
            var el = $('<div>')
            el.addClass("alert alert-danger err-msg")
            el.hide()
            if (_this[0].checkValidity() == false) {
                _this[0].reportValidity();
                return false;
            }
            start_loader();
            $.ajax({
                headers: {
                    "X-CSRFToken": '{{csrf_token}}'
                },
                url: "{% url 'login-user' %}",
                data: new FormData($(this)[0]),
                cache: false,
                contentType: false,
                processData: false,
                method: 'POST',
                type: 'POST',
                dataType: 'json',
                error: err => {
                    console.log(err)
                    alert("An error occured", 'error');
                    end_loader();
                },
                success: function(resp) {
                    if (typeof resp == 'object' && resp.status == 'success') {
                        el.removeClass("alert alert-danger err-msg")
                        if (resp.redirect) {
                            location.href = resp.redirect;
                        } else {
                            location.href = "{% url 'home-page' %}"
                        }
                    } else if (resp.status == 'failed' && !!resp.msg) {
                        el.text(resp.msg)
                    } else {
                        el.text("An error occured", 'error');
                        end_loader();
                        console.err(resp)
                    }
                    _this.prepend(el)
                    el.show('slow')
                    $("html, body, .modal").scrollTop(0);
                    end_loader()
                }
            })
        })
    })
</script>
{% endblock ScriptBlock %}
