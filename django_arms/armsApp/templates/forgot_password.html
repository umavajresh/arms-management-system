{% extends 'base.html' %}{% load static %}{% block pageContent %}
<style>
    body{
        background-image:url('{% static "assets/default/img/wallpaper.jpg" %}');
        background-repeat:no-repeat;
        background-size:cover;
    }
    main {
        height: 100%;
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: auto;
    }
</style>
<div class="d-flex flex-column w-100 justify-content-center align-items-center">
    <div class="col-lg-4 col-md-6 col-sm-12 col-xs-12">
        <div class="card card-default rounded-0 shadow">
            <div class="card-header">
                <h4 class="card-title"><b>Forgot Password</b></h4>
            </div>
            <div class="card-body">
                <div class="container-fluid">
                    <form id="forgot-password-form" action="{% url 'forgot-password' %}" method="POST">
                        {% csrf_token %}
                        <div class="mdc-layout-grid">
                            <div class="mdc-layout-grid__inner">
                                <p class="text-muted">Please enter your User ID or Username to find your account.</p>
                                
                                <div class="form-group mb-3">
                                    <label for="username" class="control-label">User ID or Username</label>
                                    <input type="text" class="form-control rounded-0" autofocus name="username" id="username" required="required">
                                </div>
                                
                                <div class="form-group mb-3">
                                    <div class="d-flex w-100 justify-content-between align-items-center">
                                        <a href="{% url 'login-page' %}">Back to Login</a>
                                        <button type="submit" class="btn btn-sm rounded-0 btn-primary">
                                            Continue
                                        </button>
                                    </div>
                                </div>
                                
                                {% if messages %}
                                <div class="form-group mb-3">
                                    {% for message in messages %}
                                    <div class="alert {% if message.tags == 'error' %}alert-danger{% elif message.tags == 'success' %}alert-success{% else %}alert-info{% endif %} mb-0">
                                        {{ message }}
                                    </div>
                                    {% endfor %}
                                </div>
                                {% endif %}
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock pageContent %}
