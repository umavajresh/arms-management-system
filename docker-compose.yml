services:
  web:
    build: .
    container_name: arms_2_0_web
    ports:
      - "8001:8001"
    environment:
      - DEBUG=False
      - ALLOWED_HOSTS=*
      - PORT=8001
      - PYTHONUNBUFFERED=1
    volumes:
      - ./django_arms/db.sqlite3:/app/django_arms/db.sqlite3
    restart: unless-stopped
